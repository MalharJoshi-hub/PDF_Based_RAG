<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>5-Day RAG Build Plan</title>
<style>
:root{
  --bg:#0f1115; --card:#1a1d24; --border:#2a2e38; --text:#e8e9ed; --sub:#9ba0ad;
  --accent:#7c9eff; --done:#4ade80; --box:padding-box;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top,0px);
  padding-bottom: env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f5f6f8; --card:#ffffff; --border:#e2e4ea; --text:#1a1d24; --sub:#6b7180; --accent:#3b5bdb;
  }
}
:root[data-theme="light"]{
  --bg:#f5f6f8; --card:#ffffff; --border:#e2e4ea; --text:#1a1d24; --sub:#6b7180; --accent:#3b5bdb;
}
html{scroll-padding-top: env(safe-area-inset-top,0px);}
*{box-sizing:border-box;}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  padding:24px 16px 48px;
}
.wrap{max-width:720px;margin:0 auto;}
h1{font-size:1.4rem;margin:0 0 4px;}
.sub{color:var(--sub);font-size:.9rem;margin:0 0 20px;}
.progress-wrap{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:22px;}
.progress-bar{height:8px;background:var(--border);border-radius:6px;overflow:hidden;margin-top:8px;}
.progress-fill{height:100%;background:var(--accent);transition:width .25s ease;}
.day{background:var(--card);border:1px solid var(--border);border-radius:14px;margin-bottom:16px;overflow:hidden;}
.day-head{padding:14px 16px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;}
.day-title{font-weight:600;font-size:1rem;}
.day-sub{color:var(--sub);font-size:.8rem;margin-top:2px;}
.day-count{font-size:.78rem;color:var(--sub);white-space:nowrap;margin-left:8px;}
.tasks{padding:0 16px 14px;display:none;}
.tasks.open{display:block;}
.task{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-top:1px solid var(--border);}
.task:first-child{border-top:none;}
.task input{margin-top:3px;width:17px;height:17px;flex-shrink:0;accent-color:var(--accent);}
.task label{flex:1;font-size:.92rem;line-height:1.35;cursor:pointer;}
.task.done label{color:var(--sub);text-decoration:line-through;}
.feeds{font-size:.72rem;color:var(--sub);margin-top:2px;}
.chev{color:var(--sub);transition:transform .2s;}
.chev.open{transform:rotate(90deg);}
.reset{display:block;margin:24px auto 0;background:none;border:1px solid var(--border);color:var(--sub);padding:8px 14px;border-radius:8px;font-size:.8rem;cursor:pointer;}
</style>
</head>
<body>
<div class="wrap">
  <h1>5-Day RAG Build Plan</h1>
  <p class="sub">Rebuilding the PDF-RAG project into a real retrieval + generation system</p>

  <div class="progress-wrap">
    <div style="display:flex;justify-content:space-between;font-size:.85rem;">
      <span id="progress-label">0 / 0 tasks done</span>
      <span id="progress-pct">0%</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
  </div>

  <div id="days"></div>

  <button class="reset" id="reset">Reset all progress</button>
</div>

<script>
const PLAN = [
  {
    day: "Day 1", title: "Retrieval pipeline", feeds: "Dataset Description, Data Preprocessing, Feature Engineering",
    tasks: [
      "Pull old app.py, static/, templates/ into the new project folder",
      "Add real chunking (split PDF text into ~300–500 token chunks with overlap)",
      "Rebuild embedding + FAISS indexing to work per-chunk, not per-PDF",
      "Add TF-IDF + cosine similarity baseline retriever",
      "Add BM25 baseline retriever",
      "Test: upload a PDF, confirm chunks + embeddings are created correctly"
    ]
  },
  {
    day: "Day 2", title: "Generation + reranker", feeds: "Model Development, Transformer Model Implementation",
    tasks: [
      "Integrate Flan-T5-base via Hugging Face transformers",
      "Wire retrieved chunks as context into a real generation call (replace old template concat)",
      "Build a simple neural reranker to reorder top-k chunks before generation",
      "Test end-to-end: question in → retrieved chunks → reranked → real generated answer out"
    ]
  },
  {
    day: "Day 3", title: "Frontend + EDA", feeds: "Exploratory Data Analysis, UI/demo",
    tasks: [
      "Rebuild frontend with Tailwind (CDN) — upload, PDF list, ask box, answer display",
      "Wire new frontend to Flask API endpoints",
      "Polish UI states (loading, empty, error)",
      "Run EDA on your test corpus: chunk length distribution, word frequency, word cloud",
      "Save EDA charts for the report"
    ]
  },
  {
    day: "Day 4", title: "Evaluation", feeds: "Results and Discussion",
    tasks: [
      "Compare retrievers: TF-IDF vs BM25 vs embedding-based (precision@k)",
      "Spot-check generation quality on a handful of test questions",
      "Capture screenshots of the working app for the report",
      "Collect all numbers/charts needed for Results and Discussion"
    ]
  },
  {
    day: "Day 5", title: "Report + slides", feeds: "Everything else",
    tasks: [
      "Write Abstract, Introduction, Literature Review",
      "Write Dataset Description, Preprocessing, EDA, Feature Engineering sections (use Day 1–3 output)",
      "Write Model Development + Transformer Implementation + Results and Discussion",
      "Write Conclusion, Future Scope, References",
      "Build presentation slides",
      "Final proofread + export report, assemble submission files"
    ]
  }
];

const STORAGE_KEY = "rag-plan-progress-v1";

function loadState(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch(e){ return {}; }
}
function saveState(state){
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e){}
}

let state = loadState();

function render(){
  const container = document.getElementById('days');
  container.innerHTML = '';
  let total = 0, done = 0;

  PLAN.forEach((day, di) => {
    const dayDone = day.tasks.filter((_, ti) => state[di+'-'+ti]).length;
    total += day.tasks.length;
    done += dayDone;

    const dayEl = document.createElement('div');
    dayEl.className = 'day';
    const isOpen = state['open-'+di] !== false; // default open
    dayEl.innerHTML = `
      <div class="day-head" data-day="${di}">
        <div>
          <div class="day-title">${day.day} — ${day.title}</div>
          <div class="day-sub">Feeds: ${day.feeds}</div>
        </div>
        <div style="display:flex;align-items:center;">
          <span class="day-count">${dayDone}/${day.tasks.length}</span>
          <span class="chev ${isOpen?'open':''}">&#9656;</span>
        </div>
      </div>
      <div class="tasks ${isOpen?'open':''}" id="tasks-${di}">
        ${day.tasks.map((t, ti) => {
          const checked = !!state[di+'-'+ti];
          return `<div class="task ${checked?'done':''}">
            <input type="checkbox" id="t-${di}-${ti}" data-day="${di}" data-task="${ti}" ${checked?'checked':''}>
            <label for="t-${di}-${ti}">${t}</label>
          </div>`;
        }).join('')}
      </div>
    `;
    container.appendChild(dayEl);
  });

  document.getElementById('progress-label').textContent = `${done} / ${total} tasks done`;
  const pct = total ? Math.round((done/total)*100) : 0;
  document.getElementById('progress-pct').textContent = pct + '%';
  document.getElementById('progress-fill').style.width = pct + '%';

  container.querySelectorAll('.day-head').forEach(el => {
    el.addEventListener('click', () => {
      const di = el.getAttribute('data-day');
      const tasksEl = document.getElementById('tasks-'+di);
      const chev = el.querySelector('.chev');
      const nowOpen = !tasksEl.classList.contains('open');
      tasksEl.classList.toggle('open');
      chev.classList.toggle('open');
      state['open-'+di] = nowOpen;
      saveState(state);
    });
  });

  container.querySelectorAll('input[type=checkbox]').forEach(cb => {
    cb.addEventListener('change', (e) => {
      const di = e.target.getAttribute('data-day');
      const ti = e.target.getAttribute('data-task');
      state[di+'-'+ti] = e.target.checked;
      saveState(state);
      render();
    });
  });
}

document.getElementById('reset').addEventListener('click', () => {
  state = {};
  saveState(state);
  render();
});

render();
</script>
</body>
</html>
